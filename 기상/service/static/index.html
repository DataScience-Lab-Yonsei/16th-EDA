<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여행 일정 날씨 점수 — 날씨의 ED아이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #eef3fb;
    --surface: #ffffff;
    --ink-primary: #16150f;
    --ink-secondary: #55534a;
    --ink-muted: #93907f;
    --border: rgba(22,21,15,0.10);
    --shadow: 0 12px 32px rgba(22,21,15,0.14), 0 2px 8px rgba(22,21,15,0.08);
    --good: #1baf7a;
    --mid: #f5b301;
    --bad: #d0342c;
    --accent: #1840a5;
    --brand-blue: #1840a5;
    --brand-blue-light: #3a6fd8;
    --brand-yellow: #ffe066;
    --c-thermal: #d97a3f; --c-humidity: #2e8f96; --c-wind: #7b7fc0;
    --c-precipitation: #2e5ea0; --c-air_quality: #a08a3d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    color: var(--ink-primary); -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .bg-scene {
    position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(180deg, rgba(238,243,251,0.94) 0%, rgba(238,243,251,0.86) 45%, rgba(238,243,251,0.94) 100%),
                url('intro_bg.jpg') no-repeat center 20%;
    background-size: cover; filter: saturate(0.9);
  }
  header {
    padding: 16px 22px; background: linear-gradient(120deg, var(--brand-blue) 0%, var(--brand-blue-light) 100%);
    display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    box-shadow: 0 2px 12px rgba(24,64,165,0.25);
  }
  header .brandline { display: flex; flex-direction: column; gap: 2px; }
  header .brand-mark { font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--brand-yellow); }
  header .brand-mark b { color: #fff; }
  header h1 { font-weight: 800; color: #fff; font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  header .header-actions { display: flex; align-items: center; gap: 8px; }
  header .home-link, header .weather-link {
    font-size: 12.5px; font-weight: 700; color: #fff; text-decoration: none;
    border-radius: 999px; padding: 7px 14px; white-space: nowrap;
  }
  header .home-link { background: transparent; border: 1px solid rgba(255,255,255,0.35); }
  header .home-link:hover { background: rgba(255,255,255,0.15); }
  header .weather-link { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.4); }
  header .weather-link:hover { background: rgba(255,255,255,0.25); }

  .intro-band { padding: 22px 22px 4px; max-width: 1180px; margin: 0 auto; }
  .intro-band h2 { margin: 0 0 8px; font-size: clamp(22px, 3vw, 30px); font-weight: 800; letter-spacing: -0.02em; }
  .intro-band p { margin: 0; color: var(--ink-secondary); font-size: 13.5px; max-width: 68ch; line-height: 1.55; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 18px 22px 80px; }
  .cols { display: grid; grid-template-columns: 380px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 980px) { .cols { grid-template-columns: 1fr; } }

  .card {
    background: rgba(255,255,255,0.68); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.6); border-radius: 20px;
    box-shadow: 0 16px 40px rgba(22,21,15,0.10); padding: 18px 20px; margin-bottom: 16px;
  }
  .card > .panel-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-muted); display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 12px;
  }

  /* ---------- 지도 ---------- */
  .map-hero { padding: 16px 18px 18px; }
  #tripMap { width: 100%; height: 440px; border-radius: 12px; background: var(--page); overflow: hidden; }
  @media (max-width: 640px) { #tripMap { height: 300px; } }
  .map-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--ink-muted); font-size: 12.5px; text-align: center; padding: 0 20px; }
  .map-pin { display: flex; flex-direction: column; align-items: center; }
  .map-pin .badge {
    width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(45deg);
    background: var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center;
  }
  .map-pin .badge span { transform: rotate(-45deg); color: #fff; font-size: 11.5px; font-weight: 800; }
  .map-pin .lbl {
    margin-top: 3px; background: rgba(22,21,15,0.82); color: #fff; font-size: 10.5px; font-weight: 600;
    padding: 2px 6px; border-radius: 6px; white-space: nowrap;
  }
  .map-arrow { color: var(--accent); font-size: 26px; font-weight: 900; text-shadow: 0 1px 3px rgba(255,255,255,0.9); }

  /* ---------- 일자 카드 ---------- */
  .day { border-bottom: 1px solid var(--border); padding: 0 0 14px; margin-bottom: 14px; }
  .day:last-of-type { border-bottom: none; margin-bottom: 4px; padding-bottom: 0; }
  .day .dhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 9px; }
  .day .dnum { font-size: 11px; font-weight: 800; letter-spacing: 0.04em; color: var(--accent); }
  .day input[type=date] {
    font-size: 12.5px; padding: 5px 7px; border: 1px solid var(--border); border-radius: 8px;
    background: #fff; width: auto; font-family: inherit;
  }
  .chiplist { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; min-height: 4px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 6px 4px 11px; font-size: 12.5px; font-weight: 600;
  }
  .chip .ord { font-size: 10px; color: var(--ink-muted); font-weight: 700; }
  .chip button {
    background: var(--page); border: none; cursor: pointer; color: var(--ink-muted);
    font-size: 11px; line-height: 1; width: 18px; height: 18px; border-radius: 50%;
  }
  .chip button:hover { background: var(--bad); color: #fff; }
  .search-wrap { position: relative; }
  input[type=text], select {
    width: 100%; padding: 9px 10px; font-family: inherit; font-size: 13.5px;
    color: var(--ink-primary); background: #fff; border: 1px solid var(--border); border-radius: 10px; appearance: none;
  }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .results {
    position: absolute; z-index: 30; top: 100%; left: 0; right: 0; margin-top: 4px; background: #fff;
    border: 1px solid var(--border); border-radius: 10px; max-height: 240px; overflow-y: auto; box-shadow: var(--shadow);
  }
  .results button {
    display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left;
    padding: 8px 11px; background: none; border: none; border-bottom: 1px solid var(--page);
    cursor: pointer; font-family: inherit; align-items: baseline;
  }
  .results button:hover, .results button:focus { background: var(--page); }
  .results .nm { font-size: 13px; font-weight: 600; }
  .results .sd { font-size: 11px; color: var(--ink-muted); white-space: nowrap; }
  .results .empty { padding: 10px 11px; font-size: 12px; color: var(--ink-muted); }
  .rm-day { background: none; border: none; cursor: pointer; font-size: 11px; font-weight: 700; color: var(--ink-muted); padding: 3px 5px; }
  .rm-day:hover { color: var(--bad); }

  .btn {
    font-family: inherit; font-size: 13.5px; font-weight: 700; padding: 11px 16px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--page); color: var(--ink-primary); cursor: pointer; width: 100%;
  }
  .btn:hover { background: var(--border); }
  .btn-primary {
    background: linear-gradient(120deg, var(--brand-blue) 0%, var(--brand-blue-light) 100%);
    border: none; color: #fff; box-shadow: 0 6px 16px rgba(24,64,165,0.3);
  }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-primary[disabled] { opacity: .5; cursor: not-allowed; }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .btn-row .btn-primary { grid-column: 1/-1; }
  .note { font-size: 11.5px; color: var(--ink-muted); margin-top: 12px; line-height: 1.5; }

  /* ---------- 기여 막대 ---------- */
  .bar { display: flex; width: 100%; border-radius: 10px; overflow: hidden; background: var(--page); border: 1px solid var(--border); }
  .bar.lg { height: 108px; }
  .bar.sm { height: 40px; }
  .seg { position: relative; display: flex; align-items: flex-end; border-right: 1px solid rgba(255,255,255,0.6); overflow: hidden; }
  .seg:last-child { border-right: none; }
  .seg .fill { width: 100%; height: 0; transition: height .55s cubic-bezier(.2,.7,.3,1); }
  .seg .fill.na { height: 100%; background: repeating-linear-gradient(45deg, var(--border), var(--border) 4px, #fff 4px, #fff 8px); }
  .seg .pct { position: absolute; top: 4px; left: 0; right: 0; text-align: center; font-size: 10px; font-weight: 700; color: var(--ink-secondary); pointer-events: none; }
  .legend { display: flex; width: 100%; margin-top: 6px; }
  .legend .lg-item { text-align: center; padding: 0 2px; min-width: 0; }
  .legend .sw { height: 4px; margin-bottom: 4px; border-radius: 2px; }
  .legend .nm { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .legend .wt { font-size: 10px; color: var(--ink-muted); }

  /* ---------- 결과 ---------- */
  .headline {
    display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: end;
    padding: 4px 0 20px; margin-bottom: 16px; border-bottom: 1px solid var(--border);
  }
  @media (max-width: 640px) { .headline { grid-template-columns: 1fr; gap: 16px; } }
  .score-big { font-size: 60px; font-weight: 800; line-height: .95; letter-spacing: -0.02em; color: var(--accent); }
  .score-big .of { font-size: 16px; color: var(--ink-muted); font-weight: 600; letter-spacing: 0; }
  .grade { display: inline-block; margin-top: 8px; font-size: 12.5px; font-weight: 700; padding: 4px 12px; border-radius: 999px; background: var(--accent); color: #fff; }
  .method { font-size: 11.5px; color: var(--ink-muted); margin-top: 0; max-width: 46ch; line-height: 1.5; }
  .bar-detail { margin-top: 10px; }
  .bar-detail summary {
    font-size: 12px; font-weight: 700; color: var(--accent); cursor: pointer; list-style: none;
    display: inline-flex; align-items: center; gap: 4px; user-select: none;
  }
  .bar-detail summary::-webkit-details-marker { display: none; }
  .bar-detail summary::before { content: "▸"; font-size: 10px; transition: transform .15s ease; }
  .bar-detail[open] summary::before { transform: rotate(90deg); }
  .bar-detail[open] summary { margin-bottom: 8px; }

  .fixbox { border-left: 3px solid var(--good); background: rgba(27,175,122,0.07); border-radius: 0 12px 12px 0; padding: 14px 16px; margin-bottom: 16px; }
  .fixbox h3 { margin: 0 0 9px; font-size: 13.5px; font-weight: 800; }
  .fixrow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 0; border-top: 1px solid var(--page); font-size: 13px; }
  .fixrow:first-of-type { border-top: none; }
  .fixrow .lbl { font-weight: 700; }
  .fixrow .when { font-size: 11px; color: var(--ink-muted); }
  .fixrow .to { font-size: 12px; color: var(--good); font-weight: 700; white-space: nowrap; }
  .fixrow .to b { font-size: 13.5px; }

  .dayblock { margin-bottom: 16px; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .dayblock > header { box-shadow: none; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 16px; background: rgba(24,64,165,0.06); }
  .dayblock h3 { margin: 0; font-size: 14px; font-weight: 800; letter-spacing: -0.01em; }
  .dayblock .dsc { font-size: 20px; font-weight: 800; line-height: 1; color: var(--accent); }
  .dayblock .dsc small { font-size: 11px; font-weight: 700; color: var(--ink-secondary); margin-left: 6px; }
  .regrow { padding: 14px 16px; border-top: 1px solid var(--page); }
  .regrow:first-child { border-top: none; }
  .regrow header { background: none; box-shadow: none; padding: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 14px; margin-bottom: 10px; }
  .regrow h4 { margin: 0; font-size: 14.5px; font-weight: 800; }
  .regrow .ord { font-size: 11px; color: var(--ink-muted); font-weight: 700; margin-right: 6px; }
  .regrow .grp { font-size: 10px; letter-spacing: 0.04em; border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px; color: var(--ink-secondary); margin-left: 7px; }
  .regrow .sc { font-size: 22px; font-weight: 800; line-height: 1; text-align: right; white-space: nowrap; color: var(--accent); }
  .regrow .sc small { display: block; font-size: 10.5px; font-weight: 700; color: var(--ink-secondary); margin-top: 3px; }
  .why { margin-top: 9px; font-size: 12.5px; color: var(--ink-secondary); display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .why b { color: var(--ink-primary); font-weight: 700; }
  .alts { margin-top: 9px; font-size: 12px; color: var(--ink-secondary); }
  .alts .a { display: inline-block; font-size: 11.5px; border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; margin: 3px 5px 0 0; background: var(--page); }
  .alts .a b { color: var(--good); }
  .flag { margin-top: 9px; padding: 8px 11px; background: var(--page); border-radius: 8px; border-left: 3px solid var(--mid); font-size: 12px; color: var(--ink-secondary); }
  .empty-state { border: 1.5px dashed var(--border); border-radius: 14px; padding: 48px 24px; text-align: center; color: var(--ink-muted); background: var(--surface); }
  .empty-state strong { display: block; color: var(--ink-secondary); font-size: 14.5px; font-weight: 700; margin-bottom: 6px; }
  .error { border: 1px solid var(--bad); border-left-width: 4px; background: var(--surface); border-radius: 12px; padding: 13px 15px; font-size: 13px; color: var(--bad); }
  .foot-note { font-size: 11.5px; color: var(--ink-muted); margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .spinner {
    display: inline-block; width: 11px; height: 11px; border: 2px solid rgba(255,255,255,0.6);
    border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; margin-right: 7px; vertical-align: -1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="bg-scene"></div>
<header>
  <div class="brandline">
    <span class="brand-mark">날씨의 <b>ED</b>아이</span>
    <h1>여행 일정 날씨 점수</h1>
  </div>
  <div class="header-actions">
    <a class="home-link" href="/">처음 화면</a>
    <a class="weather-link" href="/">오늘의 날씨 점수 →</a>
  </div>
</header>
<div class="intro-band">
  <h2>내 여행, 날씨는 몇 점일까?</h2>
  <p>날짜별로 갈 곳을 넣으면 그날 예보로 점수를 매겨드려요. 점수가 낮은 곳은 더 좋은 날짜도 함께 찾아드립니다.</p>
</div>

<div class="wrap">
  <div class="card map-hero">
    <div class="panel-label"><span>여행 경로</span><span id="mapCount">0곳</span></div>
    <div id="tripMap"><div class="map-empty">시군구를 추가하면 지도에 경로가 표시돼요</div></div>
  </div>
  <div class="cols">
    <section>
      <div class="card">
        <div class="panel-label"><span>일정</span><span id="planCount">0일</span></div>
        <div id="days"></div>
        <div class="btn-row">
          <button class="btn" id="addDay" type="button">+ 날짜 추가</button>
          <button class="btn" id="sample" type="button">예시 채우기</button>
          <button class="btn btn-primary" id="run" type="button">점수 내기</button>
        </div>
        <p class="note">예보는 기상 16일, 대기질 5일까지 잡힙니다. 시군구 264곳 모두 지원합니다.</p>
      </div>
    </section>

    <section>
      <div class="card">
        <div class="panel-label"><span>결과</span><span id="variantLabel">hybrid 가중치</span></div>
        <div id="out">
          <div class="empty-state">
            <strong>아직 계산한 계획이 없습니다</strong>
            날짜를 추가하고 시군구를 넣어 보세요.
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=c27d3f1ea71b475c4d03aeaa99221828"></script>
<script>
const COMPONENTS=["thermal","humidity","wind","precipitation","air_quality"];
const KO={thermal:"기온",humidity:"습도",wind:"바람",precipitation:"강수",air_quality:"대기질"};
const $=(s,r=document)=>r.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let plan=[], seq=0;
const iso=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);

function blankDay(offset){return {id:++seq, date:iso(offset), regions:[]};}
const dayById=id=>plan.find(d=>d.id===+id);

/* ---------------------------------------------- 지도 (카카오맵: 핀 + 순서 화살표) */
let map=null, mapOverlays=[];
function initMap(){
  if(!window.kakao || !kakao.maps) return;
  const host=$("#tripMap");
  host.innerHTML="";
  map=new kakao.maps.Map(host, {center:new kakao.maps.LatLng(36.5,127.8), level:13});
}
function clearMapOverlays(){ mapOverlays.forEach(o=>o.setMap(null)); mapOverlays=[]; }
function bearing(a,b){
  const toRad=d=>d*Math.PI/180, toDeg=r=>r*180/Math.PI;
  const y=Math.sin(toRad(b.lon-a.lon))*Math.cos(toRad(b.lat));
  const x=Math.cos(toRad(a.lat))*Math.sin(toRad(b.lat))-Math.sin(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.cos(toRad(b.lon-a.lon));
  return (toDeg(Math.atan2(y,x))+360)%360;
}
function renderMap(){
  if(!map) return;
  clearMapOverlays();
  const stops=[];
  plan.forEach(d=>d.regions.forEach(r=>{ if(r.lat!=null && r.lon!=null) stops.push(r); }));
  $("#mapCount").textContent=stops.length+"곳";
  if(!stops.length){
    $("#tripMap").querySelector(".map-empty")||( $("#tripMap").innerHTML='<div class="map-empty">시군구를 추가하면 지도에 경로가 표시돼요</div>');
    return;
  }
  if($("#tripMap .map-empty")) initMap();

  const bounds=new kakao.maps.LatLngBounds();
  const path=stops.map(s=>new kakao.maps.LatLng(s.lat,s.lon));
  path.forEach(ll=>bounds.extend(ll));

  if(stops.length>1){
    const line=new kakao.maps.Polyline({map, path, strokeWeight:3, strokeColor:"#1840a5", strokeOpacity:0.85, strokeStyle:"solid"});
    mapOverlays.push(line);
    for(let i=0;i<stops.length-1;i++){
      const a=stops[i], b=stops[i+1];
      const mid=new kakao.maps.LatLng((a.lat+b.lat)/2,(a.lon+b.lon)/2);
      const deg=bearing(a,b);
      const arrow=new kakao.maps.CustomOverlay({
        map, position:mid,
        content:`<div class="map-arrow" style="transform:rotate(${deg-90}deg)">➤</div>`,
        yAnchor:0.5, xAnchor:0.5,
      });
      mapOverlays.push(arrow);
    }
  }
  stops.forEach((s,i)=>{
    const ov=new kakao.maps.CustomOverlay({
      map, position:new kakao.maps.LatLng(s.lat,s.lon),
      content:`<div class="map-pin"><div class="badge"><span>${i+1}</span></div><div class="lbl">${esc(s.label||s.name)}</div></div>`,
      yAnchor:1, xAnchor:0.5,
    });
    mapOverlays.push(ov);
  });
  map.setBounds(bounds, 60);
}

/* ---------------------------------------------- 일정 입력 */
function renderPlan(){
  const host=$("#days"); host.innerHTML="";
  $("#planCount").textContent=plan.length+"일";
  if(!plan.length){
    host.innerHTML=`<div class="empty-state" style="padding:32px 18px">
      <strong>일정이 비어 있습니다</strong>날짜를 추가해 시작하세요.</div>`;
    renderMap();
    return;
  }
  plan.forEach((d,i)=>{
    const el=document.createElement("div"); el.className="day";
    el.innerHTML=`
      <div class="dhead">
        <span class="dnum">${i+1}일차</span>
        <input type="date" data-act="date" data-id="${d.id}" value="${d.date}" aria-label="${i+1}일차 날짜">
        <button class="rm-day" type="button" data-act="rmday" data-id="${d.id}">날짜 삭제</button>
      </div>
      <div class="chiplist">${d.regions.map((r,j)=>`
        <span class="chip"><span class="ord">${j+1}</span>${esc(r.label)}
          <button type="button" data-act="rmreg" data-id="${d.id}" data-code="${r.code}"
                  aria-label="${esc(r.label)} 빼기">×</button></span>`).join("")}
      </div>
      <div class="search-wrap">
        <input type="text" data-act="q" data-id="${d.id}" autocomplete="off"
               placeholder="시군구 검색 — 예: 종로구, 해운대, 강릉">
        <div data-role="results"></div>
      </div>`;
    host.appendChild(el);
  });
  renderMap();
}

$("#days").addEventListener("input",e=>{
  const {act,id}=e.target.dataset;
  if(act==="date"){ dayById(id).date=e.target.value; }
  if(act==="q"){ searchRegion(e.target, dayById(id)); }
});
$("#days").addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]"); if(!b) return;
  const {act,id,code}=b.dataset;
  if(act==="rmday"){ plan=plan.filter(d=>d.id!==+id); renderPlan(); }
  if(act==="rmreg"){ const d=dayById(id); d.regions=d.regions.filter(r=>r.code!==code); renderPlan(); }
});
document.addEventListener("click",e=>{
  if(!e.target.closest(".search-wrap")) document.querySelectorAll(".results").forEach(r=>r.remove());
});

let timer=null;
function searchRegion(input,day){
  clearTimeout(timer);
  const q=input.value.trim();
  const host=input.closest(".search-wrap").querySelector("[data-role=results]");
  if(!q){ host.innerHTML=""; return; }
  timer=setTimeout(async()=>{
    try{
      const {results}=await(await fetch(`/regions/search?q=${encodeURIComponent(q)}`)).json();
      if(!results.length){
        host.innerHTML=`<div class="results"><div class="empty">그런 시군구가 없습니다.</div></div>`;return;
      }
      const box=document.createElement("div"); box.className="results";
      results.forEach(r=>{
        const b=document.createElement("button"); b.type="button";
        b.innerHTML=`<span class="nm">${esc(r.name)}</span><span class="sd">${esc(r.sido)} · ${r.region_group}</span>`;
        b.onclick=()=>{
          if(!day.regions.some(x=>x.code===r.code)) day.regions.push(r);
          renderPlan();
        };
        box.appendChild(b);
      });
      host.innerHTML=""; host.appendChild(box);
    }catch{ host.innerHTML=""; }
  },220);
}

$("#addDay").onclick=()=>{ plan.push(blankDay(plan.length+1)); renderPlan(); };
$("#sample").onclick=()=>{
  seq=0;
  plan=[
    {id:++seq,date:iso(1),regions:[
      {code:"11110",label:"서울 종로구",lat:37.57477,lon:126.97961},
      {code:"11140",label:"서울 중구",lat:37.56381,lon:126.99756}]},
    {id:++seq,date:iso(2),regions:[
      {code:"51150",label:"강원 강릉시",lat:37.75211,lon:128.87591}]},
    {id:++seq,date:iso(3),regions:[
      {code:"26350",label:"부산 해운대구",lat:35.16307,lon:129.1636},
      {code:"26380",label:"부산 사하구",lat:35.10445,lon:128.97493}]},
  ];
  renderPlan();
};

/* ---------------------------------------------- 실행 */
$("#run").onclick=async()=>{
  const out=$("#out"), btn=$("#run");
  if(!plan.length) return fail(out,"일정이 비어 있습니다. 날짜를 먼저 추가하세요.");
  const empty=plan.find(d=>!d.regions.length);
  if(empty) return fail(out,`${empty.date}에 시군구가 없습니다. 최소 한 곳은 넣어 주세요.`);

  btn.disabled=true; btn.innerHTML=`<span class="spinner"></span>예보 불러오는 중`;
  try{
    const r=await fetch("/score/trip",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({days:plan.map(d=>({date:d.date,regions:d.regions.map(x=>x.code)}))})});
    const data=await r.json();
    if(!r.ok) throw new Error(data.detail||"점수를 내지 못했습니다");
    render(data);
  }catch(err){
    fail(out,err.message||"서버에 연결하지 못했습니다.");
  }finally{ btn.disabled=false; btn.textContent="점수 내기"; }
};
function fail(host,msg){ host.innerHTML=`<div class="error">${esc(msg)}</div>`; }

/* ---------------------------------------------- 기여 막대 */
function bar(weights,sub,size){
  const segs=COMPONENTS.map(c=>{
    const w=weights?.[c]??0, s=sub?.[c];
    if(w<=0) return "";
    const pct=s==null?"":`<span class="pct">${Math.round(s*100)}</span>`;
    const fill=s==null?`<div class="fill na"></div>`
      :`<div class="fill" data-h="${(s*100).toFixed(1)}" style="background:var(--c-${c})"></div>`;
    return `<div class="seg" style="flex:${w} 1 0" title="${KO[c]} · 비중 ${(w*100).toFixed(0)}% · 스트레스 ${s==null?"결측":s.toFixed(2)}">${pct}${fill}</div>`;
  }).join("");
  const legend=COMPONENTS.map(c=>{
    const w=weights?.[c]??0; if(w<=0) return "";
    return `<div class="lg-item" style="flex:${w} 1 0"><div class="sw" style="background:var(--c-${c})"></div>
      <div class="nm">${KO[c]}</div><div class="wt">${(w*100).toFixed(0)}%</div></div>`;
  }).join("");
  return `<div class="bar ${size}">${segs}</div><div class="legend">${legend}</div>`;
}
function animate(root){
  requestAnimationFrame(()=>{
    root.querySelectorAll(".fill[data-h]").forEach((el,i)=>
      setTimeout(()=>{el.style.height=el.dataset.h+"%";}, i*35));
  });
}
/* 여행 전체 막대: 모든 지역-일의 평균. 면적 = 평균 KTCI */
function tripBar(days){
  const W={},S={}; let n=0;
  days.forEach(d=>d.regions.forEach(r=>{
    if(r.score==null) return; n++;
    COMPONENTS.forEach(c=>{
      const w=r.weights_used?.[c]; if(w==null) return;
      W[c]=(W[c]||0)+w; S[c]=(S[c]||0)+w*(r.subindices[c]??0);
    });
  }));
  if(!n) return "";
  const weights={},sub={};
  COMPONENTS.forEach(c=>{ if(!W[c])return; weights[c]=W[c]/n; sub[c]=(S[c]/n)/weights[c]; });
  return bar(weights,sub,"lg");
}

/* ---------------------------------------------- 결과 */
function render(data){
  const out=$("#out"), sum=data.summary;
  $("#variantLabel").textContent=data.variant+" 가중치";
  if(sum.trip_score==null) return fail(out,"모든 일정이 예보 범위를 벗어났거나 관측 영역이 부족합니다.");

  const fix=sum.fixable.length?`
    <div class="fixbox">
      <h3>이 지역들은 날짜를 옮기면 올라갑니다</h3>
      ${sum.fixable.map(f=>`<div class="fixrow">
        <span><span class="lbl">${esc(f.label)}</span> <span class="when">${f.date.slice(5)} · ${f.score}점</span></span>
        <span class="to">${f.best_alternative.date.slice(5)}로 옮기면 <b>${f.best_alternative.score}</b> (+${f.best_alternative.gain})</span>
      </div>`).join("")}
    </div>`:"";

  const days=data.days.map((d,i)=>{
    const regions=d.regions.map(r=>{
      if(r.score==null) return `<div class="regrow">
        <header><div><span class="ord">${r.order}</span><h4 style="display:inline">${esc(r.label)}</h4></div>
        <div class="sc">—<small>점수 없음</small></div></header>
        <div class="flag">${esc(r.note)}</div></div>`;
      const top=r.top_component;
      const alts=r.alternatives.length?`<div class="alts">더 좋은 날 ${
        r.alternatives.map(a=>`<span class="a">${a.date.slice(5)} <b>${a.score}</b> (+${a.gain})</span>`).join("")}</div>`:"";
      const flag=r.missing.length?`<div class="flag">${r.missing.map(c=>KO[c]).join("·")} 결측 — 나머지 영역으로 가중치를 재정규화했습니다.</div>`:"";
      return `<div class="regrow">
        <header>
          <div><span class="ord">${r.order}</span><h4 style="display:inline">${esc(r.name)}</h4>
            <span class="grp">${r.region_group}</span>
            <div style="font-size:11px;color:var(--ink-muted);margin-top:3px">${esc(r.label)}</div></div>
          <div class="sc">${r.score}<small>${r.grade}</small></div>
        </header>
        <div class="why">${top?`<span>감점 1위 <b>${KO[top.component]}</b> ${Math.round(top.share*100)}%</span>`:""}</div>
        <details class="bar-detail"><summary>요소별 자세히 보기</summary>${bar(r.weights_used,r.subindices,"sm")}</details>
        ${alts}${flag}</div>`;
    }).join("");
    return `<div class="dayblock">
      <header><h3>${i+1}일차 · ${d.date} <span style="font-weight:400;color:var(--ink-muted);font-size:11.5px">${d.regions.length}곳</span></h3>
        <div class="dsc">${d.score??"—"}<small>${d.grade??""}</small></div></header>
      ${regions}</div>`;
  }).join("");

  out.innerHTML=`
    <div class="headline">
      <div><div class="score-big">${sum.trip_score}<span class="of"> /100</span></div>
        <div class="grade">${sum.grade}</div></div>
      <div>
        <p class="method">${esc(data.method)}</p>
        <details class="bar-detail"><summary>요소별 자세히 보기</summary>${tripBar(data.days)}</details>
      </div>
    </div>
    ${fix}
    ${days}
    <p class="foot-note">지역-일 ${sum.region_day_count}건 · 단순 평균 ${sum.region_day_mean}점 ·
      가장 낮은 곳 ${esc(sum.worst?.label??"—")} ${sum.worst?.score??""}점</p>`;
  animate(out);
}

initMap();
plan.push(blankDay(1));
renderPlan();
</script>
